<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Local Funnel architecture</title>
  <desc id="desc">A dedicated tag:tailscale-private-funnel ACL boundary isolates the control plane, load balancer, and ingress from all other tailnet nodes. Docker relays have no socket, credentials, or Tailscale identity.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#10213f" flood-opacity=".10"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#15945a"/></marker>
    <style>
      .eyebrow{font:700 13px Inter,system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;fill:#61708d}
      .heading{font:700 24px Inter,system-ui,sans-serif;fill:#10213f}
      .label{font:700 16px Inter,system-ui,sans-serif;fill:#10213f}
      .copy{font:500 14px Inter,system-ui,sans-serif;fill:#61708d}
      .mono{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#2563eb}
      .small{font:600 12px Inter,system-ui,sans-serif;fill:#15945a}
    </style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#canvas)"/>
  <text x="72" y="72" class="eyebrow">LOCAL FUNNEL · PRIVATE EDGE</text>
  <text x="72" y="116" class="heading">One policy-led path from tailnet service to public HTTPS</text>
  <text x="72" y="146" class="copy">Dedicated tag:tailscale-private-funnel ACL grants isolate this path from the rest of the tailnet.</text>

  <path d="M350 346H450" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M710 346H810" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1070 346H1170" stroke="#15945a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M580 500V580H1120V500" fill="none" stroke="#15945a" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <path d="M940 500V580" stroke="#15945a" stroke-width="3" stroke-dasharray="8 8"/>

  <g filter="url(#shadow)">
    <rect x="72" y="230" width="278" height="270" rx="20" fill="#fff" stroke="#dce4f0"/>
    <rect x="450" y="230" width="260" height="270" rx="20" fill="#fff" stroke="#dce4f0"/>
    <rect x="810" y="230" width="260" height="270" rx="20" fill="#fff" stroke="#dce4f0"/>
    <rect x="1170" y="230" width="198" height="270" rx="20" fill="#fff" stroke="#dce4f0"/>
  </g>

  <circle cx="126" cy="286" r="28" fill="#eff5ff"/><path d="M114 286h24M126 274v24M116 276l20 20M136 276l-20 20" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="170" y="286" class="eyebrow">CONTROL PLANE</text><text x="104" y="340" class="label">Authorize + reconcile</text>
  <text x="104" y="372" class="copy">WhoIs roles, enrollment,</text><text x="104" y="394" class="copy">signed reports, policy rules,</text><text x="104" y="416" class="copy">and the ownership ledger.</text>
  <rect x="104" y="448" width="198" height="30" rx="15" fill="#eaf8f0"/><circle cx="124" cy="463" r="5" fill="#15945a"/><text x="138" y="468" class="small">dedicated tag ACL only</text>

  <circle cx="498" cy="286" r="28" fill="#eff5ff"/><rect x="484" y="275" width="28" height="21" rx="3" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M484 282h28M490 302h16" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="542" y="286" class="eyebrow">LOAD BALANCER</text><text x="482" y="340" class="label">Public TLS edge</text>
  <text x="482" y="372" class="copy">Caddy terminates HTTPS,</text><text x="482" y="394" class="copy">matches approved hostnames,</text><text x="482" y="416" class="copy">and forwards to a Tailscale</text><text x="482" y="438" class="copy">Service through the tailnet.</text>
  <text x="482" y="470" class="mono">edge.preview.example.com</text>

  <circle cx="858" cy="286" r="28" fill="#eff5ff"/><path d="M846 286h12M858 286l13-13M858 286l13 13M871 273h10v10M871 299h10v-10" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="902" y="286" class="eyebrow">INGRESS</text><text x="842" y="340" class="label">Docker sidecars</text>
  <text x="842" y="372" class="copy">Discovers consolidated labels,</text><text x="842" y="394" class="copy">selects local networks, and starts</text><text x="842" y="416" class="copy">one isolated raw TCP sidecar</text><text x="842" y="438" class="copy">per approved backend port.</text>
  <text x="842" y="470" class="mono">8080:checkout.dev.example.com:http</text>

  <circle cx="1216" cy="286" r="28" fill="#eaf8f0"/><path d="M1203 286h26M1216 273v26M1207 277l18 18M1225 277l-18 18" stroke="#15945a" stroke-width="3" stroke-linecap="round"/>
  <text x="1258" y="286" class="eyebrow">DNS</text><text x="1202" y="340" class="label">Owned records</text>
  <text x="1202" y="372" class="copy">Owned A + CNAME</text><text x="1202" y="394" class="copy">records point public names</text><text x="1202" y="416" class="copy">to the load balancer through</text><text x="1202" y="438" class="copy">a provider adapter.</text>
  <text x="1202" y="470" class="mono">owner: funnel-prod</text>

  <rect x="340" y="612" width="760" height="74" rx="18" fill="#10213f"/>
  <text x="378" y="642" class="eyebrow" fill="#b8c7df">PUBLIC REQUEST</text>
  <text x="378" y="670" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="600" fill="#fff">https://app.preview.example.com  →  CNAME loadbalancer.preview.example.com  →  Tailscale Service</text>
  <text x="1124" y="656" class="small">policy approved</text>
</svg>
