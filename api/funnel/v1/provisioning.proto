syntax = "proto3";
package funnel.v1;

import "buf/validate/validate.proto";
import "funnel/v1/options.proto";

option go_package = "github.com/tailscale-x/tailscale-private-funnel/internal/gen/funnel/v1;funnelv1";
// DeploymentService authorizes deployments. Execution is performed by a generated installer on the target.
service DeploymentService {
  // Phone home using existing host connectivity. Issues only the installation
  // Tailnet gateway role, never a caller-selected role or management permission.
  rpc BootstrapTunnel(TunnelBootstrapRequest) returns (TunnelBootstrap) {
    option (permission) = PERMISSION_TAILNET;
    option (sensitive) = true;
    option (audit) = true;
  }
  // Render a secret-free foreground command; no registration or DNS mutation.
  rpc TunnelInstructions(TunnelInstructionsRequest) returns (DeploymentInstructions) {
    option (permission) = PERMISSION_VIEWER;
  }
  // Resolve deployment choices without creating bootstrap keys.
  rpc Instructions(DeploymentRequest) returns (DeploymentInstructions) {
    option (permission) = PERMISSION_ADMIN;
  }
  // Mint one-use Tailscale bootstrap credentials, without server-side execution.
  rpc Authorize(DeploymentRequest) returns (DeploymentInstructions) {
    option (permission) = PERMISSION_ADMIN;
    option (sensitive) = true;
    option (audit) = true;
  }
}
message TunnelBootstrapRequest {
  string installation = 1;
  string name = 2;
  string hostname = 3;
  uint32 port = 4 [(buf.validate.field).uint32 = {gt:0,lte:65535}];
  string local_address = 5;
}
message TunnelBootstrap {
  string auth_key = 1 [(secret) = true];
  int64 expires_at = 2;
  string installation = 3;
}
message TunnelInstructionsRequest {
  string hostname = 1;
  uint32 port = 2 [(buf.validate.field).uint32 = {gt:0,lte:65535}];
  string local_address = 3;
  string name = 4;
  string tailscale_connection = 5;
}
message DeploymentRequest {
  string mode = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.in = "operator",
    (buf.validate.field).string.in = "control",
    (buf.validate.field).string.in = "loadbalancer",
    (buf.validate.field).string.in = "docker-gateway",
    (buf.validate.field).string.in = "tailnet-gateway",
    (buf.validate.field).string.in = "k8s-gateway"
  ];
  string target = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.in = "native",
    (buf.validate.field).string.in = "kubernetes"
  ];
  string runtime = 3;
  string name = 4;
  string hostname = 5;
  string state_dir = 6;
  string data_dir = 7;
  string installation = 8;
  string resource_name = 9;
  string gateway_class = 10;
  string ingress_class = 11;
  repeated string watch_namespaces = 12;
  map<string, string> node_selector = 13;
  string certificate_email = 14;
  string public_hostname = 15;
  repeated string label_keys = 16;
  repeated string deny_networks = 17;
  string namespace = 18;
  string context = 19;
  string version = 20;
  string display_name = 21;
  string tailnet = 22;
  string oauth_client_id_file = 23;
  string oauth_client_secret_file = 24;
  string node_id = 25;
  repeated string managed_namespaces = 26;
  bool wait = 27;
  uint32 timeout_seconds = 28;
  bool current_control = 29;
  repeated string administrators = 30;
  string storage_class = 31;
  string storage_size = 32;
  // Resolved placement, carried to the executor without local file references.
  bytes placement_json = 33;
  bytes forwarder_placement_json = 34;
  DatabaseConfiguration database = 35;
  string tailscale_connection = 36;
  string tailscale_socket = 37;
  string key_issuer_secret = 38;
  string services_secret = 39;
  string services_client_id_file = 40;
  string services_client_secret_file = 41;
  string users_secret = 42;
  string users_client_id_file = 43;
  string users_client_secret_file = 44;
}
// Bootstrap credentials must not be persisted in plans, logs or receipts.
message BootstrapCredentials {
  string auth_key = 3;

  int64 expires_at = 5;
}
message DeploymentInstructions {
  DeploymentRequest deployment = 1;
  string management_url = 2;
  string version = 3;
  string image = 4;
  string chart = 5;
  string chart_version = 6;
  string namespace = 7;
  repeated DeploymentStep steps = 8;
  repeated string prerequisites = 9;
  BootstrapCredentials credentials = 10;
  string script = 11;
  string example = 12;

  map<string, string> commands = 14;
  // Preview-only bundles are rejected by hidden installers.
  bool dry_run = 15;
}
message DeploymentStep {
  string id = 1;
  string title = 2;
  string description = 3;
}

// Control database settings contain file paths or Secret references, never credentials.
message DatabaseConfiguration {
  string type = 1;
  string url_file = 2;
  string ca_file = 3;
  string tls_mode = 4;
  string connection_secret = 5;
  string connection_secret_key = 6;
  string ca_secret = 7;
  string ca_secret_key = 8;
}
