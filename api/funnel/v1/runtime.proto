syntax = "proto3";
package funnel.v1;

import "buf/validate/validate.proto";
import "funnel/v1/management.proto";
import "funnel/v1/options.proto";

option go_package = "github.com/tailscale-x/tailscale-private-funnel/internal/gen/funnel/v1;funnelv1";
// SignedEnvelope carries exact signed bytes. Decode only after verification.
message SignedEnvelope {
  string node_id = 1;
  int64 timestamp = 2;
  string nonce = 3;
  bytes public_key = 4;
  bytes payload = 5;
  bytes signature = 6;
  string purpose = 7;
}
service NodeService {
  rpc GetConfig(Empty) returns (SignedEnvelope) {
    option (permission) = PERMISSION_NODE;
    option (payload_type) = "funnel.v1.ConfigurationPayload";
  }
  rpc ResolveApplication(ResolveApplicationRequest) returns (SignedEnvelope) {
    option (permission) = PERMISSION_NODE;
    option (payload_type) = "funnel.v1.ConfigurationPayload";
  }
  rpc Acknowledge(ConfigAck) returns (Empty) {
    option (permission) = PERMISSION_NODE;
  }
  // Persist liveness without waiting for endpoint discovery or external APIs.
  rpc ReportHealth(NodeHealth) returns (Empty) {
    option (permission) = PERMISSION_NODE;
  }
  // Accept authenticated desired state durably. Success acknowledges storage,
  // not completed DNS or Service publication; bounded control workers reconcile it.
  rpc SubmitReport(SignedEnvelope) returns (Empty) {
    option (permission) = PERMISSION_NODE;
    option (payload_type) = "funnel.v1.ExposureReport";
  }
  // Complete Docker declarations, including stopped containers. No external API work.
  rpc SubmitDockerInventory(SignedEnvelope) returns (Empty) {
    option (permission) = PERMISSION_NODE;
    option (payload_type) = "funnel.v1.DockerInventoryPayload";
  }
  rpc SubmitPeers(SignedEnvelope) returns (Empty) {
    option (permission) = PERMISSION_NODE;
    option (payload_type) = "funnel.v1.PeerSnapshot";
  }
  rpc SubmitKubernetes(SignedEnvelope) returns (Empty) {
    option (permission) = PERMISSION_NODE;
    option (payload_type) = "funnel.v1.KubernetesPayload";
  }
  rpc SubmitPublicEndpoint(SignedEnvelope) returns (Empty) {
    option (permission) = PERMISSION_NODE;
    option (payload_type) = "funnel.v1.PublicEndpointPayload";
  }
  rpc EnrollForwarder(SignedEnvelope) returns (ForwarderEnrollment) {
    option (permission) = PERMISSION_NODE;
    option (sensitive) = true;
    option (payload_type) = "funnel.v1.ForwarderEnrollmentPayload";
  }
  rpc ListForwarders(Empty) returns (Nodes) {
    option (permission) = PERMISSION_NODE;
  }
  rpc BindForwarder(SignedEnvelope) returns (Empty) {
    option (permission) = PERMISSION_ENROLLMENT;
    option (payload_type) = "funnel.v1.ForwarderBindingPayload";
  }
  rpc Shutdown(ShutdownRequest) returns (TestResult) {
    option (permission) = PERMISSION_NODE;
  }
}
service EnrollmentService {
  rpc BindSigningKey(BindSigningKeyRequest) returns (Empty) {
    option (permission) = PERMISSION_ENROLLMENT;
    option (sensitive) = true;
  }
}
message BindSigningKeyRequest {
  string enrollment_id = 1;
  string code = 2 [(secret) = true];
  bytes public_key = 3 [(buf.validate.field).bytes.len = 32];
}
message ResolveApplicationRequest {
  string path_prefix = 3;
  PrefixRewrite rewrite = 4;
  string hostname = 1;
  uint32 backend_port = 2 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 65535
  }];
}
message ConfigAck {
  string revision = 1 [(buf.validate.field).string.min_len = 1];
  repeated string services = 2;
}
message NodeHealth {
  int64 last_report = 1;
  string revision = 2;
  repeated string listeners = 3;
  uint32 backends = 4;
  uint32 reachable = 5;
  string loadbalancer_hostname = 6;
  bool online = 7;
  repeated string errors = 8;
  string node_uid = 9;
  string node_name = 10;
  uint32 local_endpoints = 11;
  string withdrawal_reason = 12;
  repeated string advertised_services = 13;
}
message ForwarderEnrollment {
  string node_id = 1;
  string auth_key = 2 [(secret) = true];
}
message ForwarderEnrollmentPayload {
  string node_uid = 1;
  string hostname = 2;
  string public_key = 3;
}
message ForwarderBindingPayload {
  bool bind = 1;
}
message PublicEndpointPayload {
  string namespace = 1;
  string service = 2;
  string uid = 3;
  int64 observed_at = 4;
  repeated PublicIngress ingress = 5;
}
message PublicIngress {
  string ip = 1;
  string hostname = 2;
  string ip_mode = 3;
}
// BrokerService is served only by the installation's HTTPS broker, not control.
service BrokerService {
  rpc OpenSession(Empty) returns (BrokerSession) {
    option (permission) = PERMISSION_BROKER;
    option (sensitive) = true;
  }
  rpc GetConfig(Empty) returns (SignedEnvelope) {
    option (permission) = PERMISSION_BROKER;
    option (payload_type) = "funnel.v1.ConfigurationPayload";
  }
  rpc RenewLease(Empty) returns (Empty) {
    option (permission) = PERMISSION_BROKER;
  }
  rpc WriteState(StateUpdate) returns (Empty) {
    option (permission) = PERMISSION_BROKER;
    option (sensitive) = true;
  }
  rpc ReleaseLease(Empty) returns (Empty) {
    option (permission) = PERMISSION_BROKER;
  }
}
message StateUpdate {
  string key = 1 [(buf.validate.field).string.prefix = "tsnet."];
  bytes value = 2;
}
message BrokerSession {
  string node_uid = 1;
  string node_name = 2;
  string node_id = 3;
  string auth_key = 4 [(secret) = true];
  string management_url = 5;
  string control_key = 6;
  string controller_id = 7;
  bytes identity = 8;
  map<string, bytes> state = 9;
}

message KubernetesPayload {
  map<string, string> errors = 1;
  string cluster_id = 2;
  repeated KubernetesHost hosts = 3;
  int64 expires_at = 4;
}
message KubernetesHost {
  string hostname = 1;
  repeated HTTPRule rules = 2;
  repeated HTTPBackend backends = 3;
  repeated string resource_ids = 4;
}
message PodEndpoint {
  string address = 1;
  string pod_uid = 2;
  string node_name = 3;
  string node_uid = 4;
}
message HTTPBackend {
  repeated PodEndpoint endpoints = 1;
  string key = 2;
  string service_name = 3;
  string service = 4;
  uint32 port = 5;
  string address = 6;
  int32 weight = 7;
}
message HTTPMatch {
  string path = 1;
  bool exact = 2;
  string method = 3;
  map<string, string> headers = 4;
  map<string, string> query = 5;
}
message HeaderFilter {
  map<string, string> set = 1;
  map<string, string> add = 2;
  repeated string remove = 3;
}
message HTTPRedirect {
  string scheme = 1;
  string host = 2;
  uint32 port = 3;
  int32 status = 4;
}
message HTTPRule {
  PrefixRewrite rewrite = 11;
  string backend_request_timeout = 1;
  repeated HTTPMatch matches = 2;
  repeated HTTPBackend backends = 3;
  HeaderFilter request_headers = 4;
  HeaderFilter response_headers = 5;
  HTTPRedirect redirect = 6;
  string request_timeout = 7;
  string backend_timeout = 8;
  int64 max_request_body_bytes = 9;
  int32 priority = 10;
}
message RuntimeApplication {
  repeated HTTPRule http_rules = 1;
  repeated HTTPBackend http_backends = 2;
  string name = 3;
  string backend_source = 4;
  string backend_device_id = 5;
  repeated string backend_addresses = 6;
  string id = 7;
  string service_name = 8;
  string service_fqdn = 9;
  uint32 service_port = 10;
  uint32 backend_port = 11;
  repeated string public_hostnames = 12;
  repeated string allowed_gateway_nodes = 13;
  int64 policy_revision = 14;
  bool enabled = 15;
}
message HTTPRoute {
  repeated HTTPRule rules = 1;
  string hostname = 2;
  string service = 3;
  uint32 port = 4;
}
message ConfigurationPayload {
  repeated string published_addresses = 1;
  repeated string published_hostnames = 2;
  repeated HTTPRoute routes = 3;
  repeated Probe probes = 4;
  string node_id = 5;
  string revision = 6;
  repeated RuntimeApplication applications = 7;
  repeated string label_aliases = 8;
  int64 issued_at = 9;
}

// Shutdown first withdraws owned state; confirm acknowledges receipt before device deletion.
message ShutdownRequest { bool confirm = 1; }

// Only complete, successfully parsed scans may retire registrations.
message DockerInventoryPayload {
  int64 revision = 1 [(buf.validate.field).int64.gt = 0];
  bool complete = 2;
  repeated DockerInventoryContainer containers = 3;
  repeated string label_keys = 4;
}
message DockerInventoryContainer {
  string id = 1;
  bool running = 2;
  map<string, string> labels = 3;
}
