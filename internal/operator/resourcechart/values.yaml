component: k8s-gateway
installation: main
image:
  reference: ghcr.io/tailscale-x/tailscale-private-funnel:dev
  pullPolicy: IfNotPresent
gatewayClass: tailscale-private-funnel
ingressClass: tailscale-private-funnel
createClasses: true
watchNamespaces: []
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 768Mi

controller:
  replicas: 1
  name: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
forwarder:
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {memory: 512Mi}
networkPolicy:
  enabled: true

persistence:
  existingClaim: ""
  size: 1Gi
  storageClass: ""
control:
  database:
    type: sqlite
  nodeSelector: {}
  affinity: {}
  tolerations: []
  replicas: 1
  hostname: funnel-control
  tailnet: ""
loadbalancer:
  nodeSelector: {}
  affinity: {}
  tolerations: []
  replicas: 1
  service:
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Local
