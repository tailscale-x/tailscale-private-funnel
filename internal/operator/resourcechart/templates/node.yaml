{{- if or (eq .Values.component "control") (eq .Values.component "loadbalancer") }}
{{- include "funnel.namespaceIsolation" . }}
{{- $control := eq .Values.component "control" }}
{{- $postgres := and $control (eq .Values.control.database.type "postgres") }}
{{- $claim := default (printf "%s-data" .Release.Name) .Values.persistence.existingClaim }}
{{- if and (not $postgres) (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-{{ .Values.component }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.component }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: {{ .Values.component }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: {{ .Values.component }}, tailscale-private-funnel.io/installation: {{ .Values.installation }}}
    spec:
      serviceAccountName: {{ .Release.Name }}-{{ .Values.component }}
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml (get (index .Values .Values.component) "nodeSelector") | nindent 8 }}
      affinity: {{ toYaml (get (index .Values .Values.component) "affinity") | nindent 8 }}
      tolerations: {{ toYaml (get (index .Values .Values.component) "tolerations") | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Values.component }}
          image: {{ .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - k8s
            - runtime
            - {{ .Values.component }}
            - serve
            - --namespace={{ .Release.Namespace }}
            - --installation={{ .Values.installation }}
            {{- if not $postgres }}
            - --persistent-dir=/persist
            {{- end }}
            - --hostname={{ default .Release.Name .Values.hostname }}
            - --probe-listen=:9091
            {{- if $control }}
            - --tailnet={{ .Values.control.tailnet }}
            - --material-dir=/etc/funnel-material
            {{- if $postgres }}
            - --database=postgres
            - --database-url-file=/etc/funnel-database/connection
            - --database-tls-mode={{ default "verify-full" .Values.control.database.postgres.tlsMode }}
            {{- if .Values.control.database.postgres.caSecretRef }}
            - --database-ca-file=/etc/funnel-database-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- else }}
            - --public-hostname={{ .Values.loadbalancer.publicHostname }}
            - --certificate-email={{ .Values.loadbalancer.certificateEmail }}
            - --kubernetes-service={{ .Release.Name }}-public
            {{- end }}
          env:
            {{- include "funnel.runtimeEnvironment" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              {{- if not $control }}
              add: [NET_BIND_SERVICE]
              {{- end }}
          ports:
            - {name: health, containerPort: 9091}
            {{- if not $control }}
            - {name: http, containerPort: 80}
            - {name: https, containerPort: 443}
            {{- end }}
          startupProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: runtime, mountPath: /var/lib/tailscale-private-funnel}
            - {name: tmp, mountPath: /tmp}
            - {name: operator-token, mountPath: /var/run/secrets/funnel-operator, readOnly: true}
            - {name: operator-ca, mountPath: /etc/funnel-operator-ca, readOnly: true}
            {{- if not $control }}
            - {name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            {{- end }}
            {{- if not $postgres }}
            - {name: persistent, mountPath: /persist}
            {{- end }}
            {{- if $control }}
            - {name: material, mountPath: /etc/funnel-material, readOnly: true}
            - {name: services-credentials, mountPath: /etc/funnel-services, readOnly: true}
            - {name: users-credentials, mountPath: /etc/funnel-users, readOnly: true}
            {{- if $postgres }}
            - {name: database, mountPath: /etc/funnel-database, readOnly: true}
            {{- if .Values.control.database.postgres.caSecretRef }}
            - {name: database-ca, mountPath: /etc/funnel-database-ca, readOnly: true}
            {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        - {name: runtime, emptyDir: {medium: Memory}}
        - {name: tmp, emptyDir: {}}
        {{- include "funnel.operatorBootstrapVolumes" . | nindent 8 }}
        {{- if not $control }}
        - name: api-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
        {{- end }}
        {{- if not $postgres }}
        - name: persistent
          persistentVolumeClaim: {claimName: {{ $claim }}}
        {{- end }}
        {{- if $control }}
        - name: material
          secret: {secretName: {{ .Values.materialSecret }}, defaultMode: 0440}
        - name: users-credentials
          secret: {secretName: {{ .Values.control.usersSecret }}, defaultMode: 0440}
        - name: services-credentials
          secret: {secretName: {{ .Values.control.servicesSecret }}, defaultMode: 0440}
        {{- if $postgres }}
        - name: database
          secret:
            secretName: {{ .Values.control.database.postgres.connectionSecretRef.name }}
            defaultMode: 0440
            items: [{key: {{ .Values.control.database.postgres.connectionSecretRef.key }}, path: connection}]
        {{- if .Values.control.database.postgres.caSecretRef }}
        - name: database-ca
          secret:
            secretName: {{ .Values.control.database.postgres.caSecretRef.name }}
            items: [{key: {{ .Values.control.database.postgres.caSecretRef.key }}, path: ca.crt}]
        {{- end }}
        {{- end }}
        {{- end }}
{{- if not $control }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-public
  annotations: {{ toYaml .Values.loadbalancer.service.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  {{- if .Values.loadbalancer.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.loadbalancer.service.loadBalancerClass }}
  {{- end }}
  externalTrafficPolicy: {{ .Values.loadbalancer.service.externalTrafficPolicy }}
  {{- if .Values.loadbalancer.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml .Values.loadbalancer.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: loadbalancer}
  ports: [{name: http, port: 80, targetPort: http}, {name: https, port: 443, targetPort: https}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ .Release.Name }}-public-endpoint}
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [{{ .Release.Name }}-public]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ .Release.Name }}-public-endpoint}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-public-endpoint}
subjects: [{kind: ServiceAccount, name: {{ .Release.Name }}-loadbalancer, namespace: {{ .Release.Namespace }}}]
{{- end }}
{{- end }}
