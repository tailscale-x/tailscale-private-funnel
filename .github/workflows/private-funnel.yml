name: private-funnel

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Generate templ and build UI assets
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate ./internal/web/ui
          # Templ and icon assets must be byte-for-byte reproducible. Tailwind
          # can vary only in the final newline across supported Node runners;
          # compare normalized bytes while still failing on real CSS drift.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          generated = Path("internal/web/assets/app.css").read_bytes().replace(b"\r\n", b"\n").rstrip()
          committed = subprocess.check_output(["git", "show", "HEAD:internal/web/assets/app.css"]).replace(b"\r\n", b"\n").rstrip()
          if generated != committed:
              raise SystemExit("generated app.css differs from the committed asset")
          PY
          git diff --exit-code -- internal/web/ui/layout_templ.go internal/web/assets/icons
      - uses: azure/setup-helm@v4
      - name: Validate Kubernetes chart
        run: |
          helm lint charts/tailscale-private-funnel --set bootstrap.existingSecret=ci-bootstrap
          for component in control loadbalancer k8s-gateway; do
            helm lint charts/tailscale-private-funnel --set component="$component" --set bootstrap.existingSecret=ci-bootstrap
            helm template ci charts/tailscale-private-funnel --set component="$component" --set bootstrap.existingSecret=ci-bootstrap > "/tmp/funnel-$component.yaml"
          done
          scripts/package-chart.sh v0.0.0-ci /tmp/funnel-chart-package
          helm template ci /tmp/funnel-chart-package/tailscale-private-funnel-0.0.0-ci.tgz --set bootstrap.existingSecret=ci-bootstrap > /tmp/funnel-packaged-chart.yaml
      - run: go test ./...
      - run: go vet ./...
      - run: go test -tags caddy ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build native binaries
        run: |
          mkdir -p dist
          targets="linux-amd64"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            targets="$targets linux-arm64 darwin-arm64"
          fi
          for target in $targets; do
            GOOS=${target%-*} GOARCH=${target#*-} CGO_ENABLED=0 go build -tags caddy -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/tailscale-private-funnel-${target}" ./cmd/tailscale-private-funnel
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sha256sum dist/* > dist/SHA256SUMS
            printf '{"version":"%s","commit":"%s","image":"ghcr.io/tailscale-x/tailscale-private-funnel:%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/release-metadata.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist

  image-check:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: docker/setup-buildx-action@v3
      - name: Package the prebuilt binary
        run: |
          docker buildx build --load --platform linux/amd64 --file Dockerfile --tag private-funnel:ci .
          docker run --rm private-funnel:ci version
          docker run --rm private-funnel:ci k8s-gateway controller serve --help
          docker run --rm private-funnel:ci k8s-gateway forwarder serve --help

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/tailscale-x/tailscale-private-funnel:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
      - name: Verify published image platforms
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/tailscale-x/tailscale-private-funnel@$IMAGE_DIGEST" > /tmp/image-index.json
          python3 - <<'PY'
          import json
          index = json.load(open('/tmp/image-index.json'))
          platforms = {(m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture')) for m in index.get('manifests', [])}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package versioned Helm chart
        run: scripts/package-chart.sh "$GITHUB_REF_NAME" dist
      - name: Publish and verify OCI chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          chart_version="${GITHUB_REF_NAME#v}"
          helm push "dist/tailscale-private-funnel-${chart_version}.tgz" oci://ghcr.io/tailscale-x/charts
          mkdir -p /tmp/chart-verification
          helm pull oci://ghcr.io/tailscale-x/charts/tailscale-private-funnel --version "$chart_version" --destination /tmp/chart-verification
          cmp "dist/tailscale-private-funnel-${chart_version}.tgz" "/tmp/chart-verification/tailscale-private-funnel-${chart_version}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-private-funnel-chart
          path: dist/*.tgz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-chart
          path: dist
      - name: Include chart metadata and checksums
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          path = Path("dist/release-metadata.json")
          metadata = json.loads(path.read_text())
          metadata["image_digest"] = os.environ["IMAGE_DIGEST"]
          metadata["image_pinned"] = "ghcr.io/tailscale-x/tailscale-private-funnel@" + os.environ["IMAGE_DIGEST"]
          metadata["helm_chart"] = {"reference": "oci://ghcr.io/tailscale-x/charts/tailscale-private-funnel", "version": version, "artifact": f"tailscale-private-funnel-{version}.tgz"}
          path.write_text(json.dumps(metadata, indent=2) + "\n")
          files = sorted(p for p in Path("dist").iterdir() if p.is_file() and p.name != "SHA256SUMS")
          Path("dist/SHA256SUMS").write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*
            docs/screenshots/*.png
            docs/architecture-security.png
            docs/architecture.svg
