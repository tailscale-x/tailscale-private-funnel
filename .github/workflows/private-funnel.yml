name: private-funnel

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Generate templ and build UI assets
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate ./internal/web/ui
          # Templ and icon assets must be byte-for-byte reproducible. Tailwind
          # can vary only in the final newline across supported Node runners;
          # compare normalized bytes while still failing on real CSS drift.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          generated = Path("internal/web/assets/app.css").read_bytes().replace(b"\r\n", b"\n").rstrip()
          committed = subprocess.check_output(["git", "show", "HEAD:internal/web/assets/app.css"]).replace(b"\r\n", b"\n").rstrip()
          if generated != committed:
              raise SystemExit("generated app.css differs from the committed asset")
          PY
          git diff --exit-code -- internal/web/ui/layout_templ.go internal/web/assets/icons
      - run: go test ./...
      - run: go vet ./...
      - run: go test -tags caddy ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build native binaries
        run: |
          mkdir -p dist
          targets="linux-amd64"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            targets="$targets linux-arm64 darwin-arm64"
          fi
          for target in $targets; do
            GOOS=${target%-*} GOARCH=${target#*-} CGO_ENABLED=0 go build -tags caddy -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/tailscale-private-funnel-${target}" ./cmd/tailscale-private-funnel
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sha256sum dist/* > dist/SHA256SUMS
            printf '{"version":"%s","commit":"%s","image":"ghcr.io/tailscale-x/tailscale-private-funnel:%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/release-metadata.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist

  image-check:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: docker/setup-buildx-action@v3
      - name: Package the prebuilt binary
        run: docker buildx build --platform linux/amd64 --file Dockerfile --tag private-funnel:ci .

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/tailscale-x/tailscale-private-funnel:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*
            docs/screenshots/*.png
            docs/architecture-security.png
            docs/architecture.svg
