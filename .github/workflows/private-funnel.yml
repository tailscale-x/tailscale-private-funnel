name: private-funnel

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Generate RPC contracts and build embedded UI
        run: |
          npm ci --prefix ui
          go install github.com/bufbuild/buf/cmd/buf@v1.74.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1
          go install github.com/sudorandom/protoc-gen-connect-openapi@v0.28.0
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.0
          scripts/generate-operator.sh
          buf lint
          scripts/generate-rpc.sh
          npm run build --prefix ui
          git diff --exit-code -- internal/gen internal/rpc/descriptor.bin internal/web/assets ui/src/gen config/crd config/rbac api/kubernetes charts/tailscale-private-funnel/crds charts/tailscale-private-funnel/templates/rbac.yaml docs/KUBERNETES_API.md
          python3 scripts/code-surface.py --output /tmp/code-surface.json
      - uses: actions/upload-artifact@v4
        with:
          name: code-surface
          path: /tmp/code-surface.json
      - uses: azure/setup-helm@v4
      - name: Validate Kubernetes chart
        run: |
          helm lint charts/tailscale-private-funnel --set managedNamespaces[0]=ci-system
          helm template ci charts/tailscale-private-funnel --set managedNamespaces[0]=ci-system > /tmp/funnel-operator.yaml
          scripts/package-chart.sh v0.0.0-ci /tmp/funnel-chart-package
          helm template ci /tmp/funnel-chart-package/tailscale-private-funnel-0.0.0-ci.tgz --set managedNamespaces[0]=ci-system > /tmp/funnel-packaged-chart.yaml
      - name: API-server contract tests
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260305142021-f9589b9f2b9d
          export KUBEBUILDER_ASSETS="$(setup-envtest use -p path 1.35.x)"
          go test ./internal/operator -run TestEnvtest -count=1
      - run: go test ./...
      - run: go vet ./...
      - run: go test -tags caddy ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build native binaries
        run: |
          mkdir -p dist
          targets="linux-amd64"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            targets="$targets linux-arm64 darwin-arm64"
          fi
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="dev-${GITHUB_SHA:0:12}"; fi
          scripts/build-artifacts.sh "$version" $targets
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sha256sum dist/* > dist/SHA256SUMS
            printf '{"version":"%s","commit":"%s","image":"ghcr.io/tailscale-x/tailscale-private-funnel:%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/release-metadata.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist

  image-check:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: docker/setup-buildx-action@v3
      - name: Package the prebuilt binary
        run: |
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="dev-${GITHUB_SHA:0:12}"; fi
          docker buildx build --load --platform linux/amd64 --file Dockerfile --build-arg VERSION="$version" --tag private-funnel:ci .
          FUNNEL_IMAGE_LOCAL_ONLY=1 scripts/verify-image.sh private-funnel:ci linux/amd64
          docker run --rm private-funnel:ci version
          docker run --rm private-funnel:ci k8s runtime gateway serve --help
          docker run --rm private-funnel:ci k8s runtime forwarder serve --help

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/tailscale-x/tailscale-private-funnel:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
      - name: Verify published image platforms
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/tailscale-x/tailscale-private-funnel@$IMAGE_DIGEST" > /tmp/image-index.json
          python3 - <<'PY'
          import json
          index = json.load(open('/tmp/image-index.json'))
          platforms = {(m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture')) for m in index.get('manifests', [])}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
          scripts/verify-image.sh ghcr.io/tailscale-x/tailscale-private-funnel:$GITHUB_REF_NAME linux/amd64 linux/arm64

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package versioned Helm chart
        run: scripts/package-chart.sh "$GITHUB_REF_NAME" dist
      - name: Publish and verify OCI chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          chart_version="${GITHUB_REF_NAME#v}"
          helm push "dist/tailscale-private-funnel-${chart_version}.tgz" oci://ghcr.io/tailscale-x/charts
          mkdir -p /tmp/chart-verification
          helm pull oci://ghcr.io/tailscale-x/charts/tailscale-private-funnel --version "$chart_version" --destination /tmp/chart-verification
          cmp "dist/tailscale-private-funnel-${chart_version}.tgz" "/tmp/chart-verification/tailscale-private-funnel-${chart_version}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-private-funnel-chart
          path: dist/*.tgz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-chart
          path: dist
      - name: Include chart metadata and checksums
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          path = Path("dist/release-metadata.json")
          metadata = json.loads(path.read_text())
          metadata["image_digest"] = os.environ["IMAGE_DIGEST"]
          metadata["image_pinned"] = "ghcr.io/tailscale-x/tailscale-private-funnel@" + os.environ["IMAGE_DIGEST"]
          metadata["helm_chart"] = {"reference": "oci://ghcr.io/tailscale-x/charts/tailscale-private-funnel", "version": version, "artifact": f"tailscale-private-funnel-{version}.tgz"}
          path.write_text(json.dumps(metadata, indent=2) + "\n")
          files = sorted(p for p in Path("dist").iterdir() if p.is_file() and p.name != "SHA256SUMS")
          Path("dist/SHA256SUMS").write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*
            docs/screenshots/*.png
            docs/architecture-security.png
            docs/architecture.svg
