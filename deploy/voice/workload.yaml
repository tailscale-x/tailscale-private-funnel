apiVersion: v1
kind: Namespace
metadata:
  name: voice
  labels:
    private-funnel-access: voice
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale-private-funnel-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-models
  namespace: voice
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice
  namespace: voice
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: voice}
  template:
    metadata:
      labels: {app: voice}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 22
        fsGroup: 22
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: voice
          image: localhost/voice-server:sha-c61b8c365c70
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8765}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "4", memory: 4Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: voice-models}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: voice
  namespace: voice
spec:
  selector: {app: voice}
  ports: [{name: http, port: 8765, targetPort: http}]
