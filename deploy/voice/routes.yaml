apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-http
  namespace: tailscale-private-funnel-main-system
spec:
  gatewayClassName: tailscale-private-funnel
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              private-funnel-access: voice
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: voice
  namespace: voice
spec:
  parentRefs:
    - name: public-http
      namespace: tailscale-private-funnel-main-system
  hostnames: [voice.troly.ai.vn]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: voice
          port: 8765
