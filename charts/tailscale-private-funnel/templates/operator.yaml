{{- if not .Values.managedNamespaces }}{{ fail "managedNamespaces must explicitly list at least one installation namespace" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-private-funnel-k8s-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-private-funnel-k8s-operator
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: tailscale-private-funnel-k8s-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tailscale-private-funnel-k8s-operator}
    spec:
      serviceAccountName: tailscale-private-funnel-k8s-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      nodeSelector: {{ toYaml .Values.placement.nodeSelector | nindent 8 }}
      affinity: {{ toYaml .Values.placement.affinity | nindent 8 }}
      tolerations: {{ toYaml .Values.placement.tolerations | nindent 8 }}
      containers:
        - name: operator
          image: {{ .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - k8s
            - runtime
            - operator
            - serve
            {{- range uniq .Values.managedNamespaces }}
            - --managed-namespace={{ . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: health, containerPort: 9090}, {name: bootstrap, containerPort: 9444}]
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]

---
apiVersion: v1
kind: Service
metadata:
  name: tailscale-private-funnel-k8s-operator-bootstrap
spec:
  selector: {app.kubernetes.io/name: tailscale-private-funnel-k8s-operator}
  ports: [{name: bootstrap, port: 9444, targetPort: bootstrap}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-private-funnel-operator-tls
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tailscale-private-funnel-operator-bootstrap-tls]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-private-funnel-operator-tls
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tailscale-private-funnel-operator-tls}
subjects: [{kind: ServiceAccount, name: tailscale-private-funnel-k8s-operator, namespace: {{ .Release.Namespace }}}]
